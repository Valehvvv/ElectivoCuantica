[project]
name = "electivocuantica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "qiskit>=2.5.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.47.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

# NOTE (Fase 5): this project's main environment targets Python >=3.12
# (see `requires-python` above and `.python-version`). The SpinQ NMR SDK
# (`spinqit`, provided by the professor as a local .whl) requires Python
# 3.9 and is NOT published on PyPI, so it cannot be declared as a normal
# resolvable dependency here without breaking `uv sync`/`uv lock` for the
# main 3.12 environment.
#
# `spinq_nmr` mode therefore needs a SEPARATE, standalone Python 3.9
# virtual environment (NOT this project's `.venv`), created and populated
# with `uv venv` / `uv pip install` directly -- see
# `docs/spinq_setup.md` for the full reproducible procedure, including
# installing `spinqit` from the professor's `.whl` file.
#
# The `spinq` extra below is informational only (documents which
# already-on-PyPI packages `spinq_backend.py` needs besides `spinqit`
# itself); it intentionally reuses unpinned specifiers already satisfied
# by the base `dependencies` above so that `uv lock`/`uv sync` for the
# main 3.12 environment are unaffected whether or not this extra is
# requested. It is NOT installed by default and MUST NOT be installed
# via `uv sync --extra spinq` in the main 3.12 `.venv` (spinqit itself
# still won't resolve there) -- always use the separate 3.9 environment.
[project.optional-dependencies]
spinq = [
    "numpy",
    "qiskit",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
