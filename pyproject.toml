[project]
name = "electivocuantica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "qiskit>=2.5.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.47.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

# NOTE (Fase 5): this project's main environment targets Python >=3.12
# (see `requires-python` above and `.python-version`). The SpinQ NMR SDK
# (`spinqit`) IS published on PyPI, but only with wheels for cp38/cp39/
# cp310 (no 3.11+), so it CANNOT be resolved as a normal dependency here
# without breaking `uv sync`/`uv lock` for the main 3.12 environment.
#
# `spinq_nmr` mode therefore needs a SEPARATE, standalone Python 3.9
# virtual environment (NOT this project's `.venv`). Run
# `scripts/setup_spinq.sh`, which creates `.venv-spinq` (`uv venv
# --python 3.9 .venv-spinq`) and installs `spinqit` from PyPI into it
# (`uv pip install spinqit`) -- see `docs/spinq_setup.md` for the full
# reproducible procedure.
#
# The `spinq` extra below is informational only (documents which
# already-on-PyPI packages `spinq_backend.py` needs besides `spinqit`
# itself); it intentionally reuses unpinned specifiers already satisfied
# by the base `dependencies` above so that `uv lock`/`uv sync` for the
# main 3.12 environment are unaffected whether or not this extra is
# requested. It is NOT installed by default and MUST NOT be extended to
# include `spinqit` (it still won't resolve in the main 3.12 `.venv`)
# -- always use the separate 3.9 environment via `scripts/setup_spinq.sh`.
[project.optional-dependencies]
spinq = [
    "numpy",
    "qiskit",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
